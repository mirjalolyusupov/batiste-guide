<title>Batiste Date Code Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Golos+Text:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    /* base */
    --paper: #ffffff;
    --paper-raised: #ffffff;
    --ink: #163c3c;
    --ink-soft: #5c7c79;
    --line: #dde8e5;
    --shadow: 0 1px 2px rgba(22, 60, 60, 0.06), 0 10px 28px -14px rgba(22, 60, 60, 0.28);

    /* brand */
    --accent: #ea1595;
    --accent-ink: #ffffff;
    --teal-deep: #1f5148;
    --teal-mid: #4f9b8c;

    /* pastel block palette (from the site's photo-block sections) — kept pale
       so full-bleed sections stay light and airy rather than reading as dark */
    --pastel-mint: #d9f8ef;
    --pastel-mint-deep: #7fdcc6;
    --pastel-butter: #f9f6d9;
    --pastel-tan: #e0a84f;
    --pastel-rose: #f4d7e0;
    --pastel-sage: #7fb5a4;
    --pastel-sky: #dfeaf4;
    --pastel-bubblegum: #fbdcea;
    --pastel-lemon: #fdf1b8;

    --good: #1f7a4c;
    --good-soft: #e0f3e6;
    --bad: #c23b2c;
    --bad-soft: #fbe7e2;

    --font-display: 'Pacifico', 'Brush Script MT', cursive;
    --font-body: 'Golos Text', 'Noto Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  }

  /* This page mirrors the Batiste brand site, which always renders in its
     bright, light palette regardless of the viewer system theme, so this
     page commits to that single light look rather than swapping to dark. */

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  a { color: inherit; }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* Brand headline treatment: bold, uppercase, italic (synthesized where the
     script lacks a true italic face — every language still gets the same
     energetic slant the real Batiste headlines use). */
  .brand-headline {
    font-family: var(--font-body);
    font-weight: 800;
    font-style: italic;
    text-transform: uppercase;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  /* Header */
  header.site-header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--teal-deep);
    border-bottom: 3px solid var(--accent);
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 0;
  }

  .wordmark {
    font-family: var(--font-display);
    font-size: 1.9rem;
    color: #ffffff;
    white-space: nowrap;
    line-height: 1;
  }

  .lang-select {
    appearance: none;
    -webkit-appearance: none;
    font-family: var(--font-body);
    font-size: 0.85rem;
    font-weight: 600;
    color: #ffffff;
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 8px;
    padding: 9px 32px 9px 14px;
    cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, #fff 50%), linear-gradient(135deg, #fff 50%, transparent 50%);
    background-position: calc(100% - 17px) center, calc(100% - 12px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }

  .lang-select option {
    color: #163c3c;
    background: #fff;
  }

  .lang-select:focus-visible,
  input:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* Hero — a deliberately fixed light band (not theme-swapped): it flows
     into the product photo band below, which carries its own baked-in
     white studio background, so this stays light in both themes rather
     than fighting the photo. Text and photo are stacked, never overlaid,
     so legibility never depends on where a future photo's subject sits. */
  .hero {
    background: #fbf9f7;
    padding: 56px 0 36px;
    text-align: center;
  }

  .hero-photo-band {
    background: #fbf9f7;
    padding: 0 0 40px;
  }

  .hero-photo-band img {
    display: block;
    width: 100%;
    max-width: 780px;
    height: auto;
    margin: 0 auto;
  }

  .eyebrow {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #1f5148;
    margin: 0 0 12px;
  }

  .hero h1 {
    font-size: clamp(2rem, 5.4vw, 2.85rem);
    line-height: 1.05;
    margin: 0 auto 16px;
    max-width: 16ch;
    color: #1f5148;
  }

  .hero p.tagline {
    font-size: 1.12rem;
    font-weight: 500;
    color: #3a4a48;
    max-width: 42ch;
    margin: 0 auto 22px;
  }

  .hero-cta {
    display: inline-block;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: var(--font-body);
    font-weight: 800;
    font-style: italic;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    font-size: 0.88rem;
    text-decoration: none;
    padding: 13px 24px;
    border-radius: 4px;
  }

  /* Sections */
  section { padding: 44px 0; }

  h2.brand-headline {
    font-size: clamp(1.5rem, 3.4vw, 2rem);
    margin: 0 0 16px;
  }

  .lede {
    font-size: 1.02rem;
    color: var(--ink-soft);
    max-width: 62ch;
    margin: 0 0 24px;
  }

  #about {
    background: var(--pastel-sky);
  }

  #about .lede { color: var(--teal-deep); opacity: 0.85; }

  /* About chips */
  .chip-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  @media (max-width: 560px) {
    .chip-grid { grid-template-columns: 1fr; }
  }

  .chip-card {
    border-radius: 10px;
    padding: 16px 18px;
    color: var(--teal-deep);
  }

  .chip-card:nth-child(1) { background: var(--pastel-bubblegum); }
  .chip-card:nth-child(2) { background: var(--pastel-butter); }
  .chip-card:nth-child(3) { background: var(--pastel-mint); }
  .chip-card:nth-child(4) { background: var(--pastel-rose); }

  .chip-card .chip-label {
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-style: italic;
    margin: 0 0 6px;
  }

  .chip-card .chip-value {
    font-size: 0.92rem;
    margin: 0;
  }

  /* Tropical-cap yellow, so this section reads as a distinct, sunny block
     rather than blending into the page's white/paper base */
  #check { background: var(--pastel-lemon); }
  #check .lede { color: var(--teal-deep); }

  /* Diagram */
  .diagram {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px;
    margin: 0 0 28px;
    box-shadow: var(--shadow);
  }

  .diagram-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 14px;
  }

  .code-row {
    display: flex;
    gap: 6px;
    align-items: stretch;
    flex-wrap: wrap;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }

  .code-seg {
    border-radius: 8px;
    padding: 12px 4px;
    text-align: center;
    flex: 1 1 0;
    min-width: 64px;
  }

  .code-seg .code-chars {
    display: block;
    font-size: 1.5rem;
    font-weight: 600;
    line-height: 1;
    margin-bottom: 8px;
  }

  .code-seg .code-caption {
    display: block;
    font-family: var(--font-body);
    font-size: 0.72rem;
    font-weight: 600;
    line-height: 1.3;
  }

  .code-seg.seg-line {
    background: var(--paper);
    border: 1px dashed var(--line);
    color: var(--ink-soft);
  }

  .code-seg.seg-year {
    background: var(--accent);
    color: var(--accent-ink);
  }

  .code-seg.seg-day {
    background: var(--teal-deep);
    color: #ffffff;
  }

  .diagram-result {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 0.95rem;
    color: var(--ink-soft);
  }

  .diagram-result strong {
    color: var(--ink);
    font-weight: 600;
  }

  /* Steps */
  .steps {
    list-style: none;
    margin: 0 0 32px;
    padding: 0;
    counter-reset: step;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .steps li {
    counter-increment: step;
    display: grid;
    grid-template-columns: 30px 1fr;
    gap: 12px;
    align-items: start;
  }

  .steps li::before {
    content: counter(step);
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 0.85rem;
    color: #ffffff;
    background: var(--teal-mid);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .steps li p {
    margin: 3px 0 0;
    font-size: 0.98rem;
  }

  /* Calculator */
  .calc-card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px;
    box-shadow: var(--shadow);
  }

  .calc-card h3 {
    font-family: var(--font-body);
    font-weight: 800;
    font-style: italic;
    text-transform: uppercase;
    font-size: 1.2rem;
    margin: 0 0 6px;
    color: var(--teal-deep);
  }

  .calc-hint {
    font-size: 0.9rem;
    color: var(--ink-soft);
    margin: 0 0 18px;
  }

  .calc-form {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .calc-form input[type="text"] {
    flex: 1 1 220px;
    font-family: var(--font-mono);
    font-size: 1.05rem;
    letter-spacing: 0.03em;
    padding: 13px 16px;
    border-radius: 8px;
    border: 1.5px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    min-width: 0;
  }

  .calc-form input[type="text"]::placeholder {
    color: var(--ink-soft);
    opacity: 0.7;
  }

  .calc-form button {
    font-family: var(--font-body);
    font-size: 0.95rem;
    font-weight: 800;
    font-style: italic;
    text-transform: uppercase;
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 13px 24px;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  .calc-form button:hover { opacity: 0.9; }
  .calc-form button:active { transform: scale(0.98); }

  .calc-error {
    color: var(--bad);
    font-size: 0.88rem;
    margin: 12px 0 0;
    display: none;
  }

  .calc-error.show { display: block; }

  .calc-results {
    margin-top: 22px;
    display: none;
  }

  .calc-results.show {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  @media (max-width: 480px) {
    .calc-results.show { grid-template-columns: 1fr; }
  }

  .stat-tile {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
  }

  .stat-tile .stat-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 6px;
  }

  .stat-tile .stat-value {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--ink);
    margin: 0;
  }

  .status-pill {
    grid-column: 1 / -1;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    width: fit-content;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 999px;
  }

  .status-pill.valid { background: var(--good-soft); color: var(--good); }
  .status-pill.expired { background: var(--bad-soft); color: var(--bad); }

  .status-pill .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
  }

  /* Footer */
  footer {
    padding: 30px 0;
    background: var(--teal-mid);
  }

  footer .wordmark {
    display: block;
    text-align: center;
    margin-bottom: 10px;
    font-size: 1.5rem;
  }

  footer p {
    font-size: 0.8rem;
    color: #ffffff;
    opacity: 0.9;
    margin: 0;
    text-align: center;
  }
</style>

<header class="site-header">
  <div class="wrap header-inner">
    <span class="wordmark">Batiste</span>
    <select class="lang-select" id="langSelect" aria-label="Language"></select>
  </div>
</header>

  var LANG_ORDER = ["uz","ky","kk","tg","ka","hy","ro","be","tk","ru"];
  var currentLang = "uz";
  // Allow ?lang=xx in the URL (used by country QR codes)
  try {
    var urlLang = new URLSearchParams(window.location.search).get("lang");
    if (urlLang && LANGS[urlLang.toLowerCase()]) currentLang = urlLang.toLowerCase();
  } catch (e) {}

  var select = document.getElementById("langSelect");
  LANG_ORDER.forEach(function (code) {
    var opt = document.createElement("option");
    opt.value = code;
    opt.textContent = LANGS[code].nativeName;
    select.appendChild(opt);
  });
  select.value = currentLang;

  function applyLanguage(code) {
    currentLang = code;
    var dict = LANGS[code];
    document.documentElement.setAttribute("lang", code);
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var key = el.getAttribute("data-i18n");
      if (dict[key] !== undefined) el.textContent = dict[key];
    });
    document.getElementById("codeInput").placeholder = dict.calc_placeholder;
    // Re-run calculation display if results are already showing
    if (document.getElementById("calcResults").classList.contains("show")) {
      runCalculation(false);
    }
  }

  select.addEventListener("change", function () {
    applyLanguage(select.value);
  });

  function formatDate(code, date) {
    var dict = LANGS[code];
    return date.getDate() + " " + dict.months[date.getMonth()] + " " + date.getFullYear();
  }

  function parseCode(raw) {
    var digits = raw.replace(/[^0-9]/g, "");
    if (digits.length < 4) return null;
    var last4 = digits.slice(-4);
    var yearDigit = parseInt(last4.charAt(0), 10);
    var dayOfYear = parseInt(last4.slice(1), 10);
    if (dayOfYear < 1 || dayOfYear > 366) return null;

    var now = new Date();
    var currentYear = now.getFullYear();
    var decadeStart = Math.floor(currentYear / 10) * 10;
    var candidate = decadeStart + yearDigit;
    if (candidate > currentYear) candidate -= 10;

    var manufactureDate = new Date(candidate, 0, dayOfYear);
    var expiryDate = new Date(manufactureDate.getTime());
    expiryDate.setMonth(expiryDate.getMonth() + 36);

    return { manufactureDate: manufactureDate, expiryDate: expiryDate };
  }

  var form = document.getElementById("calcForm");
  var input = document.getElementById("codeInput");
  var errorEl = document.getElementById("calcError");
  var resultsEl = document.getElementById("calcResults");
  var madeValue = document.getElementById("madeValue");
  var expiresValue = document.getElementById("expiresValue");
  var statusPill = document.getElementById("statusPill");
  var statusText = document.getElementById("statusText");

  function runCalculation(revalidate) {
    var dict = LANGS[currentLang];
    var parsed = parseCode(input.value);

    if (!parsed) {
      if (revalidate !== false) {
        errorEl.textContent = dict.calc_error;
        errorEl.classList.add("show");
        resultsEl.classList.remove("show");
      }
      return;
    }

    errorEl.classList.remove("show");
    madeValue.textContent = formatDate(currentLang, parsed.manufactureDate);
    expiresValue.textContent = formatDate(currentLang, parsed.expiryDate);

    var today = new Date();
    var isValid = parsed.expiryDate.getTime() >= today.getTime();
    statusPill.className = "status-pill " + (isValid ? "valid" : "expired");
    statusText.textContent = isValid ? dict.calc_status_valid : dict.calc_status_expired;

    resultsEl.classList.add("show");
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    runCalculation(true);
  });

  applyLanguage(currentLang);
})();
